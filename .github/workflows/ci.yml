name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Default types (opened/synchronize/reopened) cover real contributor PRs.
    # `assigned` is added on top so the Changesets release PR - which is
    # created by a GitHub Action and therefore does not fire a standard
    # pull_request event - also gets full CI once it is assigned, the same
    # workaround publish.yml uses for its release-gate job.
    types:
      - opened
      - synchronize
      - reopened
      - assigned

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      # Cross-package imports (e.g. react/web-component importing types from
      # core) resolve via each package's built dist/ output, workspace:^
      # links straight to the source package directory rather than an
      # installed copy - so type-aware linting needs the build to have
      # already run, or those imports resolve to an unresolvable error type.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:coverage

      # Type-level regression tests for the core package's public API
      # (packages/core/src/index.test-d.ts). These type-check against
      # source, not dist/, so they don't depend on the build step above.
      - name: Type tests
        run: pnpm --filter taktische-zeichen-core run test:types

      - name: e2e Tests
        run: pnpm run test:e2e

      # Packaging validation needs the actual dist/ output and only needs to
      # run once, so it is restricted to a single matrix leg rather than a
      # separate job (that would mean a second checkout/install/build).
      - name: Lint package output (publint)
        if: matrix.node-version == 24
        run: pnpm run publint

      - name: Check published types (attw)
        if: matrix.node-version == 24
        run: pnpm run attw
